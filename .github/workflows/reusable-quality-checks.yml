name: Reusable quality checks

on:
  workflow_call:
    inputs:
      include_production_contract:
        description: Run production deployment contract checks in addition to the shared quality checks
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  checks:
    name: Backend, frontend and build checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install -r requirements.txt
          echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"

      - name: Documentation checks
        run: .venv/bin/python scripts/docs_audit.py --include-archive

      - name: Backend unit and contract checks
        env:
          SPOTIFY_STATS_TEST_SOURCE_DB: backend/tests/fixtures/seed.db
        run: |
          .venv/bin/pytest -m unit -q
          .venv/bin/pytest -m contract -q
          .venv/bin/ruff check backend/

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Frontend checks
        working-directory: frontend
        run: |
          npm ci --legacy-peer-deps
          npm test
          npm run build

      - name: Production deployment contract checks
        if: ${{ inputs.include_production_contract }}
        run: |
          .venv/bin/pytest backend/tests/unit/test_private_production_deployment.py \
            backend/tests/unit/test_music_search_production_preflight.py -q
          deploy/production/validate-deployment-config.sh --common-only
