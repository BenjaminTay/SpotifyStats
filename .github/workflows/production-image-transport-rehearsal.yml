name: Production Image Transport Rehearsal - No Deploy

on:
  workflow_dispatch:
    inputs:
      resume_revision:
        description: Optional failed smoke revision whose fully uploaded staging should be recovered
        required: false
        default: ""
      resume_manifest_sha256:
        description: Out-of-band manifest SHA-256 for resume_revision
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: spotify-stats-image-transport-rehearsal
  cancel-in-progress: false

env:
  TCR_REGISTRY: ccr.ccs.tencentyun.com
  LOCAL_API_IMAGE: spotify-stats-api:transport-${{ github.sha }}
  LOCAL_WEB_IMAGE: spotify-stats-web:transport-${{ github.sha }}

jobs:
  build_and_package_transport_artifact:
    name: Build and package transport artifact
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      artifact_bytes: ${{ steps.artifact.outputs.artifact_bytes }}
      manifest_sha256: ${{ steps.artifact.outputs.manifest_sha256 }}
    steps:
      - uses: actions/checkout@v4

      - name: Initialize build and archive summary
        run: |
          started_at="$(date +%s)"
          printf 'JOB_STARTED_AT=%s\n' "$started_at" > "$RUNNER_TEMP/image-transport-timings"
          {
            echo "## Build and private CAS Artifact"
            echo
            echo "| Stage | Elapsed (seconds) | Artifact bytes |"
            echo "| --- | ---: | ---: |"
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: docker/setup-buildx-action@v3

      - name: Mark API build start
        run: echo "API_BUILD_STARTED_AT=$(date +%s)" >> "$RUNNER_TEMP/image-transport-timings"

      - name: Build linux/amd64 API transport image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          target: backend
          platforms: linux/amd64
          load: true
          provenance: false
          tags: ${{ env.LOCAL_API_IMAGE }}
          labels: org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=spotify-stats-api
          cache-to: type=gha,mode=max,scope=spotify-stats-api

      - name: Record API build elapsed
        run: |
          source "$RUNNER_TEMP/image-transport-timings"
          elapsed="$(( $(date +%s) - API_BUILD_STARTED_AT ))"
          printf '| API build | %s | - |\n' "$elapsed" >> "$GITHUB_STEP_SUMMARY"
          echo "WEB_BUILD_STARTED_AT=$(date +%s)" >> "$RUNNER_TEMP/image-transport-timings"

      - name: Build linux/amd64 Web transport image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          target: frontend-server
          platforms: linux/amd64
          build-args: NGINX_CONFIG=deploy/production/nginx.conf
          load: true
          provenance: false
          tags: ${{ env.LOCAL_WEB_IMAGE }}
          labels: org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=spotify-stats-web
          cache-to: type=gha,mode=max,scope=spotify-stats-web

      - name: Record Web build elapsed
        run: |
          source "$RUNNER_TEMP/image-transport-timings"
          elapsed="$(( $(date +%s) - WEB_BUILD_STARTED_AT ))"
          printf '| Web build | %s | - |\n' "$elapsed" >> "$GITHUB_STEP_SUMMARY"

      - name: Create validated Docker-save CAS Artifact
        id: artifact
        run: |
          started_at="$(date +%s)"
          archive="$RUNNER_TEMP/docker-save-${GITHUB_SHA}.tar"
          artifact="$RUNNER_TEMP/image-bundle"
          docker image save "$LOCAL_API_IMAGE" "$LOCAL_WEB_IMAGE" --output "$archive"
          python3 deploy/production/image_transport.py build-artifact \
            --archive "$archive" \
            --artifact "$artifact" \
            --revision "$GITHUB_SHA" \
            --mode smoke
          manifest_sha256="$(sha256sum "$artifact/transport-manifest.json" | cut -d ' ' -f 1)"
          artifact_bytes="$(du --bytes --summarize "$artifact" | cut -f 1)"
          elapsed="$(( $(date +%s) - started_at ))"
          printf '| Docker-save CAS layout | %s | %s |\n' "$elapsed" "$artifact_bytes" >> "$GITHUB_STEP_SUMMARY"
          echo "manifest_sha256=$manifest_sha256" >> "$GITHUB_OUTPUT"
          echo "artifact_bytes=$artifact_bytes" >> "$GITHUB_OUTPUT"
          echo "ARTIFACT_BYTES=$artifact_bytes" >> "$GITHUB_ENV"

      - name: Mark private Artifact upload start
        run: echo "ARTIFACT_STARTED_AT=$(date +%s)" >> "$RUNNER_TEMP/image-transport-timings"

      - name: Upload one-day private CAS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: spotify-stats-image-transport-rehearsal-${{ github.sha }}
          path: ${{ runner.temp }}/image-bundle
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

      - name: Record private Artifact upload elapsed
        run: |
          source "$RUNNER_TEMP/image-transport-timings"
          elapsed="$(( $(date +%s) - ARTIFACT_STARTED_AT ))"
          printf '| Private CAS Artifact upload | %s | %s |\n' "$elapsed" "$ARTIFACT_BYTES" >> "$GITHUB_STEP_SUMMARY"

      - name: Record bounded build job total
        if: always()
        run: |
          source "$RUNNER_TEMP/image-transport-timings"
          elapsed="$(( $(date +%s) - JOB_STARTED_AT ))"
          printf '| **Build job total** | **%s** | **%s** |\n' "$elapsed" "${ARTIFACT_BYTES:--}" >> "$GITHUB_STEP_SUMMARY"

  rehearse_transport_without_deploy:
    needs: build_and_package_transport_artifact
    name: Rehearse transport without deployment
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment: production
    env:
      ARTIFACT_BYTES: ${{ needs.build_and_package_transport_artifact.outputs.artifact_bytes }}
      MANIFEST_SHA256: ${{ needs.build_and_package_transport_artifact.outputs.manifest_sha256 }}
    steps:
      - uses: actions/checkout@v4

      - name: Initialize transfer summary
        run: |
          started_at="$(date +%s)"
          printf 'JOB_STARTED_AT=%s\n' "$started_at" > "$RUNNER_TEMP/image-transport-timings"
          echo "ARTIFACT_DOWNLOAD_STARTED_AT=$started_at" >> "$RUNNER_TEMP/image-transport-timings"
          {
            echo "## CAS Artifact download and server round trip"
            echo
            echo "| Stage | Elapsed (seconds) | Bytes |"
            echo "| --- | ---: | ---: |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Download private CAS Artifact
        uses: actions/download-artifact@v4
        with:
          name: spotify-stats-image-transport-rehearsal-${{ github.sha }}
          path: ${{ runner.temp }}/image-bundle

      - name: Record private Artifact download elapsed
        run: |
          source "$RUNNER_TEMP/image-transport-timings"
          elapsed="$(( $(date +%s) - ARTIFACT_DOWNLOAD_STARTED_AT ))"
          printf '| Private CAS Artifact download | %s | %s |\n' "$elapsed" "$ARTIFACT_BYTES" >> "$GITHUB_STEP_SUMMARY"

      - name: Configure pinned SSH host identity
        env:
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
          SERVER_KNOWN_HOSTS: ${{ secrets.SERVER_KNOWN_HOSTS }}
        run: |
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$SERVER_SSH_KEY" > "$RUNNER_TEMP/spotify-stats-transport-key"
          chmod 600 "$RUNNER_TEMP/spotify-stats-transport-key"
          printf '%s\n' "$SERVER_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Prepare shared CAS ownership without changing live services
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
        run: |
          rsync --archive --checksum --partial --partial-dir=.cas-scripts-partial \
            --delay-updates --timeout=300 \
            -e "ssh -p $SERVER_PORT -i $RUNNER_TEMP/spotify-stats-transport-key" \
            deploy/production/image_transport.py \
            "$SERVER_USER@$SERVER_HOST:/opt/spotify-stats/"
          ssh -p "$SERVER_PORT" -i "$RUNNER_TEMP/spotify-stats-transport-key" \
            "$SERVER_USER@$SERVER_HOST" bash -s <<'REMOTE'
          set -Eeuo pipefail
          releases=/opt/spotify-stats/releases
          sudo install -d -m 700 -o "$USER" -g "$USER" \
            "$releases" "$releases/blobs" "$releases/blobs/sha256" \
            "$releases/locks" "$releases/records" "$releases/state" \
            "$releases/incoming"
          REMOTE

      - name: Verify current production image identity read-only
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
        run: |
          ssh -p "$SERVER_PORT" -i "$RUNNER_TEMP/spotify-stats-transport-key" \
            "$SERVER_USER@$SERVER_HOST" bash -s <<'REMOTE'
          set -Eeuo pipefail
          env_file=/opt/spotify-stats/.env
          get_env() {
            local key="$1"
            sed -n "s/^${key}=//p" "$env_file" | tail -n 1
          }
          revision="$(get_env IMAGE_TAG)"
          registry="$(get_env TCR_REGISTRY)"
          namespace="$(get_env TCR_NAMESPACE)"
          api_repository="$(get_env API_REPOSITORY)"
          web_repository="$(get_env WEB_REPOSITORY)"
          registry="${registry:-ccr.ccs.tencentyun.com}"
          namespace="${namespace:-teacher-honor}"
          api_repository="${api_repository:-spotify-stats-api}"
          web_repository="${web_repository:-spotify-stats-web}"
          [[ "$revision" =~ ^[0-9a-f]{40}$ ]]
          status=0
          legacy_unlabeled=0
          for role_and_ref in \
            "api|${registry%/}/$namespace/$api_repository:$revision" \
            "web|${registry%/}/$namespace/$web_repository:$revision"; do
            role="${role_and_ref%%|*}"
            image_ref="${role_and_ref#*|}"
            if ! platform="$(docker image inspect --format '{{.Os}}/{{.Architecture}}' "$image_ref" 2>/dev/null)"; then
              printf '%s current image is missing for exact IMAGE_TAG\n' "$role" >&2
              status=1
              continue
            fi
            label="$(docker image inspect --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' "$image_ref")"
            printf '%s current image identity: platform=%s revision=%s\n' "$role" "$platform" "${label:-<missing>}"
            if [[ "$platform" != linux/amd64 ]]; then
              status=1
            elif [[ -z "$label" ]]; then
              legacy_unlabeled=1
            elif [[ "$label" != "$revision" ]]; then
              status=1
            fi
          done
          (( status == 0 ))
          if (( legacy_unlabeled != 0 )); then
            printf 'legacy current images remain registry-only until the first labeled release: revision=%s\n' "$revision"
          else
            printf 'current production images are bootstrap-safe: revision=%s platform=linux/amd64\n' "$revision"
          fi
          REMOTE

      - name: Optionally recover a digest-bound completed upload into CAS
        if: ${{ inputs.resume_revision != '' || inputs.resume_manifest_sha256 != '' }}
        env:
          RESUME_REVISION: ${{ inputs.resume_revision }}
          RESUME_MANIFEST_SHA256: ${{ inputs.resume_manifest_sha256 }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
        run: |
          [[ "$RESUME_REVISION" =~ ^[0-9a-f]{40}$ ]]
          [[ "$RESUME_MANIFEST_SHA256" =~ ^[0-9a-f]{64}$ ]]
          ssh -p "$SERVER_PORT" -i "$RUNNER_TEMP/spotify-stats-transport-key" \
            "$SERVER_USER@$SERVER_HOST" \
            "python3 /opt/spotify-stats/image_transport.py materialize \
              --staging '/opt/spotify-stats/releases/incoming/$RESUME_REVISION/smoke' \
              --releases-root /opt/spotify-stats/releases \
              --revision '$RESUME_REVISION' --mode smoke \
              --manifest-sha256 '$RESUME_MANIFEST_SHA256'"
          ssh -p "$SERVER_PORT" -i "$RUNNER_TEMP/spotify-stats-transport-key" \
            "$SERVER_USER@$SERVER_HOST" bash -s -- "$RESUME_REVISION" <<'REMOTE'
          set -Eeuo pipefail
          revision="$1"
          [[ "$revision" =~ ^[0-9a-f]{40}$ ]]
          staging="/opt/spotify-stats/releases/incoming/$revision/smoke"
          [[ -d "$staging" && ! -L "$staging" ]]
          find "$staging" -depth -mindepth 1 -delete
          sudo rmdir -- "$staging"
          sudo rmdir --ignore-fail-on-non-empty "/opt/spotify-stats/releases/incoming/$revision"
          REMOTE

      - name: Transfer only missing CAS blobs and load smoke images
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
        run: |
          started_at="$(date +%s)"
          result="$RUNNER_TEMP/cas-transfer-result"
          deploy/production/transfer-image-artifact.sh \
            "$RUNNER_TEMP/image-bundle" "$GITHUB_SHA" smoke "$MANIFEST_SHA256" \
            "$SERVER_USER@$SERVER_HOST" "$SERVER_PORT" \
            "$RUNNER_TEMP/spotify-stats-transport-key" "$result"
          source "$result"
          elapsed="$(( $(date +%s) - started_at ))"
          printf '| CAS missing blobs (%s files) | %s | %s |\n' "$missing_count" "$elapsed" "$missing_bytes" >> "$GITHUB_STEP_SUMMARY"
          printf '| rsync wire bytes (up to 4 shards) | %s | %s |\n' "$elapsed" "$transferred_wire_bytes" >> "$GITHUB_STEP_SUMMARY"

      - name: Publish and pull non-production TCR smoke tags
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          TCR_USERNAME: ${{ secrets.TCR_USERNAME }}
          TCR_PASSWORD: ${{ secrets.TCR_PASSWORD }}
        run: |
          staging_dir="/opt/spotify-stats/releases/incoming/$GITHUB_SHA/smoke"
          printf '%s' "$TCR_PASSWORD" | ssh -p "$SERVER_PORT" \
            -i "$RUNNER_TEMP/spotify-stats-transport-key" "$SERVER_USER@$SERVER_HOST" \
            "timeout --signal=TERM --kill-after=10s 1m docker login '$TCR_REGISTRY' --username '$TCR_USERNAME' --password-stdin"
          ssh -p "$SERVER_PORT" -i "$RUNNER_TEMP/spotify-stats-transport-key" \
            "$SERVER_USER@$SERVER_HOST" \
            "bash '$staging_dir/publish-release-images.sh' '$GITHUB_SHA' smoke"

      - name: Prove live containers unchanged and clean successful staging
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
        run: |
          ssh -p "$SERVER_PORT" -i "$RUNNER_TEMP/spotify-stats-transport-key" \
            "$SERVER_USER@$SERVER_HOST" bash -s -- "$GITHUB_SHA" <<'REMOTE'
          set -Eeuo pipefail
          revision="$1"
          [[ "$revision" =~ ^[0-9a-f]{40}$ ]]
          staging_dir="/opt/spotify-stats/releases/incoming/$revision/smoke"
          docker ps --no-trunc --format '{{.ID}}\t{{.Image}}\t{{.Names}}' | LC_ALL=C sort > "$staging_dir/live-containers.after"
          cmp --silent "$staging_dir/live-containers.before" "$staging_dir/live-containers.after"
          find "$staging_dir" -depth -mindepth 1 -delete
          rmdir -- "$staging_dir"
          sudo rmdir --ignore-fail-on-non-empty "/opt/spotify-stats/releases/incoming/$revision"
          REMOTE

      - name: Record bounded transfer job total
        if: always()
        run: |
          source "$RUNNER_TEMP/image-transport-timings"
          elapsed="$(( $(date +%s) - JOB_STARTED_AT ))"
          printf '| **Transfer job total** | **%s** | **%s** |\n' "$elapsed" "$ARTIFACT_BYTES" >> "$GITHUB_STEP_SUMMARY"
