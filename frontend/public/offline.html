<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#17151c" />
    <link rel="icon" type="image/png" href="/pwa/icon-192.png" />
    <title>Spotify Stats · 暂时离线</title>
    <style>
      :root { color-scheme: dark; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      * { box-sizing: border-box; }
      body { min-height: 100svh; margin: 0; display: grid; place-items: center; padding: max(24px, env(safe-area-inset-top)) 22px max(24px, env(safe-area-inset-bottom)); color: #f7f3ec; background: radial-gradient(circle at 18% 12%, rgba(139,61,255,.25), transparent 36%), radial-gradient(circle at 82% 88%, rgba(71,191,255,.18), transparent 38%), #17151c; }
      main { width: min(100%, 420px); padding: 28px; border: 1px solid rgba(247,243,236,.16); border-radius: 28px; background: rgba(255,255,255,.055); box-shadow: 0 28px 80px rgba(0,0,0,.32); backdrop-filter: blur(24px); }
      img { width: 58px; height: 58px; border-radius: 16px; }
      p { margin: 20px 0 5px; color: #bba6df; font-size: 11px; font-weight: 800; letter-spacing: .13em; text-transform: uppercase; }
      h1 { margin: 0; font-family: Georgia, serif; font-size: clamp(32px, 10vw, 46px); line-height: 1.02; }
      span { display: block; margin-top: 14px; color: rgba(247,243,236,.68); font-size: 14px; line-height: 1.65; }
      button { width: 100%; min-height: 48px; margin-top: 24px; border: 0; border-radius: 15px; color: #17151c; background: #f7f3ec; font: inherit; font-weight: 750; }
    </style>
  </head>
  <body>
    <main>
      <img src="/pwa/icon-192.png" alt="" />
      <p>Offline / Local data</p>
      <h1>暂时连接不到你的音乐档案</h1>
      <span>Spotify Stats 不会把个人播放数据缓存到离线空间。请确认后端服务和网络连接后再试。</span>
      <button type="button" onclick="window.location.reload()">重新连接</button>
    </main>
  </body>
</html>
